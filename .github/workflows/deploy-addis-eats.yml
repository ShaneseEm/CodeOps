name: Deploy Addis Eats to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'day32_addis_eats/**'
      - '.github/workflows/deploy-addis-eats.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: day32_addis_eats/package-lock.json

      - name: Install dependencies
        working-directory: day32_addis_eats
        run: npm ci

      - name: Build production bundle
        working-directory: day32_addis_eats
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'day32_addis_eats/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
